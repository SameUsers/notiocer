[project]
name = "notiocer"
version = "1.0.0"
description = "Рассылка счетов из Excel с маршрутизацией по получателям"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchangelib==5.6.0",
    "openpyxl==3.1.5",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyodbc==5.3.0",
    "PyYAML==6.0.3",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-mock==3.17.0", "ruff==0.17.2", "pdoc==16.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (сортировка импортов)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",
    "B905",
    "W293",
]
fixable = ["ALL"]
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
